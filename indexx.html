<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Happy Birthday, Lora 🌼</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='16' r='11' fill='%23D98C8C'/%3E%3Ccircle cx='47' cy='27' r='11' fill='%23D98C8C'/%3E%3Ccircle cx='41' cy='45' r='11' fill='%23D98C8C'/%3E%3Ccircle cx='23' cy='45' r='11' fill='%23D98C8C'/%3E%3Ccircle cx='17' cy='27' r='11' fill='%23D98C8C'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%23E8B44A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#EAE6F5;
    --sky-mid:#FBF3E4;
    --sky-bottom:#F6CBAA;
    --hill-back:#94A87F;
    --hill-front:#5C7355;
    --stem:#4A6741;
    --rose:#D98C8C;
    --gold:#E8B44A;
    --ink:#4A3B32;
    --cloud:#FFFDF8;
  }

  body[data-time="night"]{
    --sky-top:#14132C;
    --sky-mid:#211E45;
    --sky-bottom:#3B3167;
    --hill-back:#333F30;
    --hill-front:#1E271B;
    --stem:#AFCBA1;
    --ink:#F3EEE3;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
    overflow-x:hidden;
    font-family:'Quicksand',sans-serif;
    color:var(--ink);
    transition:color 1.4s ease;
  }

  .scene{
    position:relative;
    width:100%;
    height:100svh;
    min-height:560px;
    overflow:hidden;
  }

  /* ---------- SKY ---------- */
  .sky{
    position:absolute;
    inset:0;
    background:linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-bottom) 100%);
    transition:background 1.4s ease;
  }

  .day-layer,.night-layer{
    position:absolute;
    inset:0;
    transition:opacity 1.4s ease;
  }
  .day-layer{ opacity:1; }
  .night-layer{ opacity:0; }
  body[data-time="night"] .day-layer{ opacity:0; }
  body[data-time="night"] .night-layer{ opacity:1; }

  .sun{
    position:absolute;
    top:9%;
    right:11%;
    width:min(140px, 18vw);
    height:min(140px, 18vw);
    border-radius:50%;
    background:radial-gradient(circle, #FFEFC4 0%, var(--gold) 65%, rgba(232,180,74,0) 100%);
    box-shadow:0 0 90px 25px rgba(232,180,74,.30);
  }

  .moon{
    position:absolute;
    top:9%;
    right:13%;
    width:min(96px, 13vw);
    height:min(96px, 13vw);
    border-radius:50%;
    background:radial-gradient(circle at 38% 35%, #FFFDF3 0%, #E4E1F0 55%, rgba(228,225,240,0) 100%);
    box-shadow:0 0 55px 14px rgba(228,225,240,.25);
  }
  .moon::before{
    content:"";
    position:absolute;
    top:18%; left:8%;
    width:34%; height:34%;
    border-radius:50%;
    background:rgba(190,188,215,.35);
  }
  .moon::after{
    content:"";
    position:absolute;
    bottom:22%; right:20%;
    width:20%; height:20%;
    border-radius:50%;
    background:rgba(190,188,215,.3);
  }

  .stars{ position:absolute; inset:0; }
  .star{
    position:absolute;
    width:2.5px;
    height:2.5px;
    border-radius:50%;
    background:#FFFDF3;
    animation:twinkle 3s ease-in-out infinite;
  }

  .cloud{
    position:absolute;
    background:var(--cloud);
    border-radius:100px;
    opacity:.85;
    filter:blur(.5px);
  }
  .cloud::before,.cloud::after{
    content:"";
    position:absolute;
    background:var(--cloud);
    border-radius:100px;
  }
  .cloud-1{ top:14%; width:120px; height:34px; left:-160px; animation:drift 42s linear infinite; }
  .cloud-1::before{ width:60px;height:60px; top:-26px; left:14px; }
  .cloud-1::after{ width:44px;height:44px; top:-16px; left:60px; }

  .cloud-2{ top:22%; width:90px; height:28px; left:-140px; animation:drift 58s linear infinite; animation-delay:-20s; transform:scale(.8); }
  .cloud-2::before{ width:46px;height:46px; top:-20px; left:10px; }
  .cloud-2::after{ width:34px;height:34px; top:-12px; left:46px; }

  .cloud-3{ top:9%; width:100px; height:30px; left:-150px; animation:drift 50s linear infinite; animation-delay:-8s; transform:scale(.65); }
  .cloud-3::before{ width:50px;height:50px; top:-22px; left:12px; }
  .cloud-3::after{ width:38px;height:38px; top:-14px; left:50px; }

  @keyframes drift{
    from{ transform:translateX(0) scale(var(--s,1)); }
    to{ transform:translateX(calc(100vw + 260px)) scale(var(--s,1)); }
  }

  /* ---------- HERO CONTENT ---------- */
  .hero-content{
    position:relative;
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding-top:9vh;
    gap:.9rem;
  }

  .eyebrow{
    margin:0;
    font-size:clamp(.75rem,1.6vw,.95rem);
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--stem);
    font-weight:600;
    opacity:.75;
    transition:color 1.4s ease;
  }

  .title{
    margin:0;
    font-family:'Fraunces',serif;
    font-weight:600;
    line-height:1.05;
    font-size:clamp(2.1rem,6vw,3.6rem);
  }
  .title .name{
    display:inline-block;
    font-style:italic;
    color:var(--rose);
  }

  /* ---------- LIVE COUNTDOWN (before the day) ---------- */
  .live-countdown{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:clamp(1rem,4vw,2rem);
    margin-top:.4rem;
  }
  .time-unit{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:56px;
  }
  .time-value{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:clamp(2rem,6.5vw,3.3rem);
    line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .time-label{
    margin-top:.35rem;
    font-size:clamp(.62rem,1.4vw,.8rem);
    text-transform:uppercase;
    letter-spacing:.1em;
    font-weight:600;
    color:var(--stem);
    opacity:.75;
    transition:color 1.4s ease;
  }

  /* ---------- BLOOM MESSAGE (on the day) ---------- */
  .bloom-message{
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .cake{
    font-size:clamp(3rem,9vw,4.5rem);
    margin-bottom:.9rem;
  }
  .love-note{
    margin:0;
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(.95rem,2.8vw,1.25rem);
    max-width:min(78vw,260px);
    text-align:center;
    color:var(--ink);
    background:rgba(255,253,248,.9);
    padding:.5rem 1.1rem;
    border-radius:999px;
    box-shadow:0 6px 14px rgba(20,15,8,.18);
  }

  /* ---------- MEADOW ---------- */
  .hill{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
  }
  .hill-back{ height:40vh; z-index:2; }
  .hill-front{ height:30vh; z-index:3; }
  .hill path{ transition:fill 1.4s ease; }

  .flower-wrap{
    position:absolute;
    bottom:2vh;
    left:50%;
    transform:translateX(-50%);
    height:38vh;
    z-index:4;
    cursor:pointer;
    transform-origin:50% 100%;
  }
  #flower{ height:100%; width:auto; overflow:visible; }

  @media (prefers-reduced-motion:no-preference){
    .flower-wrap{ animation:sway 5s ease-in-out infinite; }
  }
  @keyframes sway{
    0%,100%{ transform:translateX(-50%) rotate(-1.2deg); }
    50%{ transform:translateX(-50%) rotate(1.2deg); }
  }
  .flower-wrap.bounce{ animation:bounce .5s ease; }
  @keyframes bounce{
    0%{ transform:translateX(-50%) scale(1); }
    35%{ transform:translateX(-50%) scale(1.06,.94); }
    60%{ transform:translateX(-50%) scale(.97,1.04); }
    100%{ transform:translateX(-50%) scale(1); }
  }

  #stem{
    stroke:var(--stem);
    stroke-width:6;
    fill:none;
    stroke-linecap:round;
    stroke-dasharray:300;
    stroke-dashoffset:300;
    transition:stroke-dashoffset 1.8s ease, stroke 1.4s ease;
  }
  [data-stage="seed"] #stem{ stroke-dashoffset:255; }
  [data-stage="sprout"] #stem{ stroke-dashoffset:165; }
  [data-stage="bud"] #stem{ stroke-dashoffset:75; }
  [data-stage="opening"] #stem,[data-stage="bloom"] #stem{ stroke-dashoffset:0; }

  .leaf{
    fill:var(--hill-back);
    opacity:0;
    transform:scale(.3);
    transform-box:fill-box;
    transform-origin:center;
    transition:all 1.1s ease;
  }
  [data-stage="sprout"] .leaf,
  [data-stage="bud"] .leaf,
  [data-stage="opening"] .leaf,
  [data-stage="bloom"] .leaf{ opacity:1; transform:scale(1); }

  #bud-circle{
    fill:var(--rose);
    opacity:0;
    transform:scale(.2);
    transform-box:fill-box;
    transform-origin:center;
    transition:all 1s ease;
  }
  [data-stage="bud"] #bud-circle,
  [data-stage="opening"] #bud-circle,
  [data-stage="bloom"] #bud-circle{ opacity:1; transform:scale(1); }

  .petal{
    fill:var(--rose);
    opacity:0;
    transform:scale(.2);
    transform-box:fill-box;
    transform-origin:center;
    transition:all .9s ease;
  }
  [data-stage="opening"] .petal{ opacity:.65; transform:scale(.55); }
  [data-stage="bloom"] .petal{ opacity:1; transform:scale(1); }

  #flower-center{
    fill:var(--gold);
    opacity:0;
    transform:scale(0);
    transform-box:fill-box;
    transform-origin:center;
    transition:all .8s ease .25s;
  }
  [data-stage="bloom"] #flower-center{ opacity:1; transform:scale(1); }

  /* ---------- PHOTO CARD ---------- */
  .photo-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.7rem;
  }
  .photo-wrap.over-flower{
    position:fixed;
    left:50%;
    bottom:16vh;
    transform:translateX(-50%);
    z-index:15;
  }
  .photo-card{
    position:relative;
    width:clamp(200px,42vw,300px);
    background:#FFFDF8;
    padding:10px 10px 32px 10px;
    border-radius:8px;
    box-shadow:0 14px 26px rgba(20,15,8,.28);
    transform:rotate(-3deg);
  }
  .photo-card img{
    display:block;
    width:100%;
    border-radius:3px;
  }
  .photo-card .caption{
    position:absolute;
    bottom:8px; left:0; right:0;
    text-align:center;
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:600;
    font-size:.78rem;
    color:var(--ink);
    margin:0;
  }
  @media (prefers-reduced-motion:no-preference){
    .photo-card.celebrate{
      animation:photoPop 1.3s ease, photoGlowPulse 3s ease-in-out infinite;
    }
  }
  @keyframes photoPop{
    0%{ transform:rotate(-3deg) scale(.3); opacity:0; }
    45%{ transform:rotate(4deg) scale(1.15); opacity:1; }
    70%{ transform:rotate(-2deg) scale(.97); }
    100%{ transform:rotate(-3deg) scale(1); }
  }
  @keyframes photoGlowPulse{
    0%,100%{ box-shadow:0 14px 26px rgba(20,15,8,.28); }
    50%{ box-shadow:0 10px 24px rgba(20,15,8,.2), 0 0 26px 7px rgba(232,180,74,.5); }
  }

  @media (prefers-reduced-motion:no-preference){
    .cat-1{ animation:catBob 3.2s ease-in-out infinite; }
    .cat-2{ animation:catBob 3.2s ease-in-out infinite; animation-delay:.6s; }
    .paw-1{ animation:pat1 1.8s ease-in-out infinite; }
    .paw-2{ animation:pat2 1.8s ease-in-out infinite; animation-delay:.9s; }
    .tail-1{ animation:tailsway1 2.6s ease-in-out infinite; }
    .tail-2{ animation:tailsway2 2.6s ease-in-out infinite; animation-delay:.4s; }
    .yarn{ animation:yarnwobble 2.4s ease-in-out infinite; }
  }
  .cat-1,.cat-2{ transform-box:fill-box; transform-origin:center; }
  .paw-1{ transform-box:fill-box; transform-origin:114px 100px; }
  .paw-2{ transform-box:fill-box; transform-origin:186px 102px; }
  .tail-1{ transform-box:fill-box; transform-origin:34px 130px; }
  .tail-2{ transform-box:fill-box; transform-origin:270px 116px; }
  .yarn{ transform-box:fill-box; transform-origin:160px 128px; }

  @keyframes catBob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-3px); } }
  @keyframes pat1{ 0%,100%{ transform:rotate(-6deg); } 50%{ transform:rotate(22deg); } }
  @keyframes pat2{ 0%,100%{ transform:rotate(6deg); } 50%{ transform:rotate(-22deg); } }
  @keyframes tailsway1{ 0%,100%{ transform:rotate(-8deg); } 50%{ transform:rotate(10deg); } }
  @keyframes tailsway2{ 0%,100%{ transform:rotate(8deg); } 50%{ transform:rotate(-10deg); } }
  @keyframes yarnwobble{
    0%,50%,100%{ transform:translate(0,0) rotate(0deg); }
    25%{ transform:translate(-4px,1px) rotate(-14deg); }
    75%{ transform:translate(4px,1px) rotate(14deg); }
  }

  .sparkle{
    position:absolute;
    width:6px;height:6px;
    border-radius:50%;
    background:var(--gold);
    opacity:0;
    z-index:6;
  }
  body.is-bday .sparkle{
    animation:twinkle 2.2s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0; transform:scale(.6); }
    50%{ opacity:1; transform:scale(1); }
  }

  /* ---------- CONFETTI ---------- */
  #confetti-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:20;
    overflow:hidden;
  }
  .confetti-piece{
    position:absolute;
    top:-12px;
    width:8px;
    height:14px;
    border-radius:2px;
    opacity:.95;
    animation:fall var(--duration,3s) var(--delay,0s) linear forwards;
  }
  @keyframes fall{
    0%{ transform:translateY(-10px) translateX(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(110vh) translateX(var(--drift,0px)) rotate(360deg); opacity:0; }
  }

  @media (max-width:600px){
    .sun,.moon{
      width:min(60px,15vw);
      height:min(60px,15vw);
      top:calc(4% + env(safe-area-inset-top,0px));
      right:7%;
    }
    .hero-content{
      padding-top:calc(13vh + env(safe-area-inset-top,0px));
      gap:.7rem;
    }
    .live-countdown{
      gap:clamp(.5rem,2.8vw,1rem);
    }
    .time-unit{ min-width:42px; }
    .flower-wrap{ height:30vh; }
    .photo-card{ width:clamp(150px,55vw,220px); }
    .photo-wrap.over-flower{ bottom:14vh; }
  }

  @media (max-width:360px){
    .live-countdown{ gap:.4rem; }
    .time-unit{ min-width:38px; }
  }

  /* ---------- LOCK SCREEN ---------- */
  #lockScreen{
    position:fixed;
    inset:0;
    z-index:50;
    background:linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-bottom) 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1rem;
    padding:2rem;
    text-align:center;
  }
  .lock-icon{ font-size:3rem; }
  .lock-title{
    margin:0;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(1.3rem,4vw,1.8rem);
    color:var(--ink);
  }
  .lock-sub{
    margin:0;
    font-size:.9rem;
    color:var(--ink);
    opacity:.7;
  }
  #lockForm{
    display:flex;
    gap:.6rem;
    margin-top:.4rem;
  }
  #lockInput{
    font-family:'Quicksand',sans-serif;
    font-size:1.1rem;
    font-weight:600;
    letter-spacing:.15em;
    text-align:center;
    width:9rem;
    padding:.7rem .5rem;
    border-radius:999px;
    border:1.5px solid var(--hill-front);
    outline:none;
    background:#FFFDF8;
    color:var(--ink);
  }
  #lockInput:focus{ border-color:var(--rose); }
  #lockSubmit{
    font-family:'Quicksand',sans-serif;
    font-weight:700;
    font-size:1rem;
    padding:.7rem 1.3rem;
    border-radius:999px;
    border:none;
    background:var(--rose);
    color:#FFFDF8;
    cursor:pointer;
  }
  #lockError{
    margin:0;
    color:#B24C4C;
    font-size:.85rem;
    font-weight:600;
    height:1.1em;
  }
  #lockForm.shake{ animation:shake .4s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-8px); }
    75%{ transform:translateX(8px); }
  }
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-icon">🔒</div>
  <h2 class="lock-title">A little secret just for you</h2>
  <p class="lock-sub">Enter the code to open it</p>
  <form id="lockForm">
    <input id="lockInput" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="code" required />
    <button id="lockSubmit" type="submit">Unlock</button>
  </form>
  <p id="lockError"></p>
</div>

<div class="scene">
  <div class="sky">
    <div class="day-layer">
      <div class="sun"></div>
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>
    </div>
    <div class="night-layer">
      <div class="moon"></div>
      <div class="stars" id="stars"></div>
    </div>
  </div>

  <div class="hero-content">
    <p class="eyebrow" id="eyebrow">a little countdown, made with love</p>

    <div class="live-countdown" id="liveCountdown">
      <div class="time-unit"><span class="time-value" id="tDays">--</span><span class="time-label">days</span></div>
      <div class="time-unit"><span class="time-value" id="tHours">--</span><span class="time-label">hours</span></div>
      <div class="time-unit"><span class="time-value" id="tMinutes">--</span><span class="time-label">minutes</span></div>
      <div class="time-unit"><span class="time-value" id="tSeconds">--</span><span class="time-label">seconds</span></div>
    </div>

<script>
  // ---------------------------------------------------------
  // Customize here:
  const CONFIG = {
    name: "Lora",
    birthdayMonth: 8,   // August
    birthdayDay: 11,
    accessCode: "1108"  // change this to whatever code you want to share with her
  };
  // ---------------------------------------------------------

  const lockScreen = document.getElementById("lockScreen");
  const lockForm = document.getElementById("lockForm");
  const lockInput = document.getElementById("lockInput");
  const lockError = document.getElementById("lockError");

  // The lock is intentionally reset on every page load or refresh.
  // Nothing is saved in localStorage or sessionStorage.
  lockScreen.style.display = "flex";
  lockInput.value = "";
  setTimeout(() => lockInput.focus(), 100);

  lockForm.addEventListener("submit", (e) => {
    e.preventDefault();
    if (lockInput.value.trim() === CONFIG.accessCode){
      lockError.textContent = "";
      lockScreen.style.display = "none";
    } else {
      lockError.textContent = "That's not quite it — try again.";
      lockForm.classList.remove("shake");
      void lockForm.offsetWidth;
      lockForm.classList.add("shake");
      lockInput.value = "";
      lockInput.focus();
    }
  });

  const flowerEl = document.getElementById("flower");
  const eyebrowEl = document.getElementById("eyebrow");
  const liveCountdownEl = document.getElementById("liveCountdown");
  const titleEl = document.getElementById("title");
  const bloomMessageEl = document.getElementById("bloomMessage");
  const tDays = document.getElementById("tDays");
  const tHours = document.getElementById("tHours");
  const tMinutes = document.getElementById("tMinutes");
  const tSeconds = document.getElementById("tSeconds");
  const starsEl = document.getElementById("stars");
  const photoCardEl = document.getElementById("photoCard");
  const photoWrapEl = document.getElementById("photoWrap");
  const loveNoteEl = document.getElementById("loveNote");

  let bloomed = false;
  let lastStage = null;
  let lastTimeOfDay = null;

  function pad(n){ return String(n).padStart(2, "0"); }

  function isBirthdayToday(now){
    return (now.getMonth() + 1) === CONFIG.birthdayMonth && now.getDate() === CONFIG.birthdayDay;
  }

  function getNextBirthdayMidnight(now){
    let year = now.getFullYear();
    let target = new Date(year, CONFIG.birthdayMonth - 1, CONFIG.birthdayDay, 0, 0, 0, 0);
    if (target <= now){
      target = new Date(year + 1, CONFIG.birthdayMonth - 1, CONFIG.birthdayDay, 0, 0, 0, 0);
    }
    return target;
  }

  function setStage(stage){
    if (stage === lastStage) return;
    lastStage = stage;
    flowerEl.setAttribute("data-stage", stage);
  }

  function generateStars(count){
    for (let i = 0; i < count; i++){
      const star = document.createElement("div");
      star.className = "star";
      star.style.top = (Math.random() * 55) + "%";
      star.style.left = (Math.random() * 100) + "%";
      star.style.animationDelay = (Math.random() * 3) + "s";
      star.style.opacity = (0.4 + Math.random() * 0.6).toFixed(2);
      starsEl.appendChild(star);
    }
  }

  function updateTimeOfDay(now){
    const hour = now.getHours();
    const isNight = hour >= 19 || hour < 7;
    const timeOfDay = isNight ? "night" : "day";
    if (timeOfDay === lastTimeOfDay) return;
    lastTimeOfDay = timeOfDay;
    document.body.setAttribute("data-time", timeOfDay);
  }

  function activateBloom(){
    bloomed = true;
    eyebrowEl.style.display = "none";
    liveCountdownEl.style.display = "none";
    titleEl.style.display = "";
    bloomMessageEl.style.display = "flex";
    document.body.classList.add("is-bday");
    photoWrapEl.classList.add("over-flower");
    photoCardEl.classList.add("celebrate");
    loveNoteEl.style.display = "block";
    setStage("bloom");
    launchConfetti(60);
  }

  function tick(){
    const now = new Date();
    updateTimeOfDay(now);

    if (bloomed) return;

    if (isBirthdayToday(now)){
      activateBloom();
      return;
    }

    const target = getNextBirthdayMidnight(now);
    const diffMs = Math.max(0, target - now);
    const totalSeconds = Math.floor(diffMs / 1000);

    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    tDays.textContent = days;
    tHours.textContent = pad(hours);
    tMinutes.textContent = pad(minutes);
    tSeconds.textContent = pad(seconds);

    const daysForStage = Math.ceil(diffMs / 86400000);
    let stage;
    if (daysForStage <= 3) stage = "opening";
    else if (daysForStage <= 10) stage = "bud";
    else if (daysForStage <= 21) stage = "sprout";
    else stage = "seed";
    setStage(stage);
  }

  function launchConfetti(amount){
    const layer = document.getElementById("confetti-layer");
    const colors = ["#D98C8C", "#E8B44A", "#7C9473", "#FFFDF8"];
    for (let i = 0; i < amount; i++){
      const el = document.createElement("div");
      el.className = "confetti-piece";
      el.style.left = Math.random() * 100 + "%";
      el.style.setProperty("--delay", (Math.random() * 1.4) + "s");
      el.style.setProperty("--duration", (2.6 + Math.random() * 2) + "s");
      el.style.setProperty("--drift", (Math.random() * 90 - 45) + "px");
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      layer.appendChild(el);
      setTimeout(() => el.remove(), 5200);
    }
  }

  generateStars(20);
  tick();
  setInterval(tick, 1000);

  // A little delight: tap the flower any time for a gentle bounce
  const flowerWrap = document.getElementById("flowerWrap");
  flowerWrap.addEventListener("click", () => {
    flowerWrap.classList.remove("bounce");
    void flowerWrap.offsetWidth; // restart animation
    flowerWrap.classList.add("bounce");
  });
</script>

</body>
</html>
